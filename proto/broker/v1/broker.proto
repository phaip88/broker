syntax = "proto3";

package broker.v1;

option go_package = "github.com/nono-vos/broker/gen/broker/v1;brokerv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

service BrokerControl {
  rpc GetHealth(google.protobuf.Empty) returns (Health);
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc PutOriginGraph(PutOriginGraphRequest) returns (OriginGraph);
  rpc CreateLease(CreateLeaseRequest) returns (Lease);
  rpc RevokeLease(RevokeLeaseRequest) returns (google.protobuf.Empty);
  rpc AppendEvent(AppendEventRequest) returns (Event);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc CancelExecution(CancelExecutionRequest) returns (google.protobuf.Empty);
}

service BrowserRelay {
  rpc Open(OpenRelayRequest) returns (stream RelayFrame);
  rpc Send(stream RelayFrame) returns (stream RelayFrame);
}

message Health { string status = 1; string version = 2; }
message Project { string id = 1; string name = 2; string description = 3; }
message CreateProjectRequest { string id = 1; string name = 2; string description = 3; }

message OriginGraph {
  string project_id = 1;
  repeated OriginNode nodes = 2;
  repeated OriginEdge edges = 3;
  uint64 revision = 4;
}
message OriginNode {
  string id = 1;
  string origin = 2;
  OriginKind kind = 3;
  bool allow_browser = 4;
  bool allow_api = 5;
}
message OriginEdge { string from_node = 1; string to_node = 2; string reason = 3; }
enum OriginKind { ORIGIN_KIND_UNSPECIFIED = 0; PRIMARY = 1; AUTH = 2; API = 3; CDN = 4; PAYMENT = 5; OTHER = 6; }
message PutOriginGraphRequest { string project_id = 1; OriginGraph graph = 2; }

message CreateLeaseRequest {
  string project_id = 1;
  string graph_revision = 2;
  google.protobuf.Duration ttl = 3;
  uint64 event_budget = 4;
  ExecutionMode mode = 5;
}
message Lease {
  string id = 1;
  string project_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  uint64 event_budget = 4;
  uint64 events_used = 5;
  ExecutionMode mode = 6;
  LeaseState state = 7;
}
enum ExecutionMode { EXECUTION_MODE_UNSPECIFIED = 0; OBSERVATION = 1; EXPERIMENT = 2; PRODUCTION = 3; }
enum LeaseState { LEASE_STATE_UNSPECIFIED = 0; ACTIVE = 1; REVOKED = 2; EXPIRED = 3; EXHAUSTED = 4; }
message RevokeLeaseRequest { string lease_id = 1; string reason = 2; }

message Event {
  string id = 1;
  string lease_id = 2;
  string trace_id = 3;
  string request_ref = 4;
  string action_ref = 5;
  EventType type = 6;
  string method = 7;
  string url = 8;
  uint32 status = 9;
  bytes redacted_metadata = 10;
  google.protobuf.Timestamp created_at = 11;
}
enum EventType { EVENT_TYPE_UNSPECIFIED = 0; REQUEST = 1; RESPONSE = 2; ACTION = 3; CRYPTO_OBSERVATION = 4; SESSION = 5; }
message AppendEventRequest { Event event = 1; }
message ListEventsRequest { string lease_id = 1; uint32 limit = 2; string page_token = 3; }
message ListEventsResponse { repeated Event events = 1; string next_page_token = 2; }
message CancelExecutionRequest { string lease_id = 1; string reason = 2; }

message OpenRelayRequest { string lease_id = 1; string trace_id = 2; }
message RelayFrame {
  string stream_id = 1;
  RelayFrameType type = 2;
  bytes headers = 3;
  bytes body = 4;
  bool end_stream = 5;
}
enum RelayFrameType { RELAY_FRAME_TYPE_UNSPECIFIED = 0; OPEN = 1; HEADERS = 2; DATA = 3; RESET = 4; CLOSE = 5; }
